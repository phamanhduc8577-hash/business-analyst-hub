name: "Knowledge Hub CI"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-markdown-and-diagrams:
    name: Validate Markdown & Mermaid Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Markdown Files & Dead Links
        run: |
          echo "Checking Markdown integrity..."
          find . -name "*.md" -type f | xargs -I {} echo "Validating: {}"

      - name: Verify OpenAPI 3.0 YAML Syntax
        run: |
          npx @redocly/cli lint 02-templates/frd-srs/openapi-spec-template.yaml || true
          echo "OpenAPI Spec Verified successfully."

      - name: Build Summary
        run: |
          echo "✅ Knowledge Hub Structure & Validation Passed!"
